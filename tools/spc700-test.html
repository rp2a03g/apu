<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SPC700 命令テスト (SingleStepTests)</title>
<style>
  body{font:14px/1.5 system-ui,sans-serif;margin:1.5rem;max-width:900px}
  h1{font-size:18px}
  button{font:inherit;padding:.4em .9em;border:1px solid #888;border-radius:6px;background:#f6f6f4;cursor:pointer}
  #sum{margin:.8rem 0;font-weight:600}
  #grid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:1rem}
  .op{font:11px/1.4 monospace;text-align:center;padding:3px 0;border-radius:3px;background:#eee;color:#555}
  .op.pass{background:#d8f0dc;color:#1b6b2f}
  .op.fail{background:#f6c9c9;color:#8a1f1f}
  .op.err{background:#eee;color:#aaa}
  pre{background:#f6f6f4;padding:.8em;border-radius:6px;overflow:auto;max-height:40vh}
  .muted{color:#777}
</style>
</head>
<body>
<h1>SPC700 命令テスト</h1>
<p class="muted">外部テストベクタ <code>SingleStepTests/spc700</code>（各命令1000ケース、初期状態→1命令実行→最終状態を照合）で
<code>MML.Emu.SPC700</code> を全256オペコード検証する。レジスタ・PSW・RAM を比較（サイクル数は未比較）。</p>
<button id="run">全256オペコードをテスト</button>
<div id="sum"></div>
<div id="grid"></div>
<pre id="detail" hidden></pre>
<script src="../src/emulator/spc700.js"></script>
<script src="cpu-test-core.js"></script>
<script>
// 検証ロジックは cpu-test-core.js に集約(CLI版 tools/headless/cpu-test.js と共通)。
// このページが持つのは画面表示とベクタ取得だけ。
const SPEC = MML.CpuTest.SPECS['spc700'];
const FILES = SPEC.groups()[0].files;
const grid = document.getElementById('grid');
const cells = {};
for (const f of FILES) {
  const c = document.createElement('div');
  c.className = 'op'; c.textContent = f.hex; c.title = f.hex;
  grid.appendChild(c); cells[f.hex] = c;
}

document.getElementById('run').onclick = async () => {
  const runner = SPEC.createRunner();
  const sum = document.getElementById('sum');
  const detail = document.getElementById('detail');
  let totalFail = 0, oksum = 0, tsum = 0; const failReport = {};
  for (const f of FILES) {
    sum.textContent = `テスト中… ${f.hex}`;
    let r;
    try {
      const res = await fetch(SPEC.vectorBase + f.path);
      if (!res.ok) { cells[f.hex].className = 'op err'; continue; }
      // per を渡さない = ファイルに入っている全ケース(このベクタは1命令1000ケース)
      r = runner.runOne(await res.json(), Infinity);
    } catch (e) { cells[f.hex].className = 'op err'; cells[f.hex].title = String(e); continue; }
    oksum += r.pass; tsum += r.total;
    if (r.pass === r.total) cells[f.hex].className = 'op pass';
    else { cells[f.hex].className = 'op fail'; totalFail++; failReport[f.hex] = r.fails; cells[f.hex].title = `${r.total - r.pass}/${r.total} fail`; }
  }
  sum.textContent = totalFail === 0
    ? `✅ 全256オペコード PASS（${oksum.toLocaleString()} / ${tsum.toLocaleString()} ケース）`
    : `❌ ${totalFail} オペコードで失敗（${(tsum - oksum).toLocaleString()} ケース）`;
  if (totalFail) { detail.hidden = false; detail.textContent = JSON.stringify(failReport, null, 2); }
};
</script>
</body>
</html>
